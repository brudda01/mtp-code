name: baseline_rules
seed: 42
rounds: 1000
time: {round_unit: trading_session, periods_per_year: 252}
market: {mechanism: call_auction, tick: 0.1, price_band: 0.2, transaction_tax: 0.0}
asset:
  model: iid_permanent
  ticker: KGP
  initial_price: 100
  risk_free: 0.0002
  dividend: {mean: 0.02, relative_noise: 0.2}
# Revealed value is a diagnostic for value-based price discovery, not an
# information-inference experiment or a human-realism claim.
reveal_fundamental: true
news: []
observation: {price_history_len: 20}
execution: {max_workers: 8}
agents:
  - type: market_maker
    count: 1
    cash: 30000
    shares: 150
    params: {spread: 0.005, inventory_limit: 300, inventory_target: 150, inventory_skew: 0.02, quote_size: 10}
  - {type: zero_intelligence, count: 8, cash: 10000, shares: 100}
  - {type: fundamentalist, count: 6, cash: 10000, shares: 100, params: {delta: 0.03, aggressiveness: 0.5}}
  - {type: momentum, count: 5, cash: 10000, shares: 100, params: {window: 5, aggressiveness: 0.5}}
